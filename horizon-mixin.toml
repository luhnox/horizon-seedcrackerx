[mod]
id = "seedcrackerx"
version = "0.2.0"
priority = 90

# The Nightly this was written against: the Horizon the instance plays. It reads the game's world and the seed the server
# sent, so it names the commit it needs; Baritone is pinned to the same one, so the two build together.
[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

